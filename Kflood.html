<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Flood</title>
<style>
:root {
  --bg: #0d0d1a;
  --surface: #16162a;
  --border: #2a2a4a;
  --accent: #7c3aed;
  --accent-light: #a78bfa;
  --text: #e2e8f0;
  --muted: #7c8ba1;
  --ok: #10b981;
  --err: #ef4444;
  --warn: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px
           calc(env(safe-area-inset-bottom, 0px) + 24px);
  max-width: 480px;
  margin: 0 auto;
}

/* ─── header ─── */
.header { text-align: center; padding: 18px 0 20px; }
.header h1 {
  font-size: 2rem; font-weight: 800;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}
.header p { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }

/* ─── card ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
}
.card-label {
  font-size: 0.7rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
}

/* ─── inputs ─── */
input[type="text"], input[type="number"], textarea, select {
  width: 100%;
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-size: 1.05rem; padding: 13px 14px; outline: none;
  transition: border-color .2s; -webkit-appearance: none; appearance: none;
  font-family: inherit;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[type="text"]#pin {
  font-size: 1.6rem; font-weight: 700; letter-spacing: 4px; text-align: center;
}
textarea { resize: vertical; line-height: 1.5; min-height: 90px; }

/* ─── range ─── */
.range-wrap { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
input[type="range"] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 6px; background: var(--border); border-radius: 20px;
  border: none; padding: 0; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  box-shadow: 0 0 0 4px rgba(124,58,237,.2);
}
.range-badge {
  background: var(--accent); color: #fff; font-weight: 800;
  font-size: 0.9rem; padding: 5px 12px; border-radius: 20px; min-width: 52px;
  text-align: center;
}

/* ─── progress ─── */
.prog-bar { width: 100%; height: 5px; background: var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #60a5fa); border-radius: 10px; width: 0; transition: width .4s; }

/* ─── mode buttons ─── */
.mode-group { display: flex; gap: 8px; margin-bottom: 12px; }
.mode-btn {
  flex: 1; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--muted); font-size: 0.8rem; font-weight: 600;
  padding: 11px 4px; cursor: pointer; transition: all .2s; text-align: center; line-height: 1.3;
}
.mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ─── stats ─── */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 8px; text-align: center;
}
.stat-num { font-size: 1.6rem; font-weight: 900; line-height: 1; margin-bottom: 3px; }
.stat-num.ok { color: var(--ok); }
.stat-num.err { color: var(--err); }
.stat-num.warn { color: var(--warn); }
.stat-lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

/* ─── button ─── */
#startBtn {
  width: 100%; border: none; border-radius: 16px; color: #fff;
  font-size: 1.1rem; font-weight: 800; padding: 17px; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #2563eb);
  box-shadow: 0 4px 20px rgba(124,58,237,.3); transition: all .2s;
  letter-spacing: .3px; margin-bottom: 12px;
}
#startBtn:active { transform: scale(.98); box-shadow: none; }
#startBtn.stop { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 4px 20px rgba(220,38,38,.3); }
#startBtn:disabled { opacity: .4; cursor: not-allowed; }

/* ─── log ─── */
#log {
  background: #070710; border: 1px solid var(--border); border-radius: 12px;
  font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: .72rem;
  color: var(--muted); padding: 10px 12px; height: 180px;
  overflow-y: auto; line-height: 1.65;
}
#log .ok { color: var(--ok); }
#log .err { color: var(--err); }
#log .info { color: var(--accent-light); }
#log .warn { color: var(--warn); }

/* ─── extra-opt ─── */
#extra-opts .card-label { margin-top: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ K-Flood</h1>
  <p>kahoot bot flooder — 100% local, sans serveur</p>
</div>

<!-- PIN -->
<div class="card">
  <div class="card-label">Code PIN Kahoot</div>
  <input type="text" id="pin" inputmode="numeric" pattern="[0-9]*" placeholder="000000" maxlength="10" autocomplete="off">
</div>

<!-- Bot count -->
<div class="card">
  <div class="card-label">Nombre de bots — <span id="cntLabel">20</span></div>
  <div class="range-wrap">
    <input type="range" id="botCount" min="1" max="200" value="20">
    <div class="range-badge" id="rdisp">20</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
</div>

<!-- Name mode -->
<div class="card">
  <div class="card-label">Mode de pseudo</div>
  <div class="mode-group">
    <div class="mode-btn active" data-mode="random">🎲<br>Aléatoire</div>
    <div class="mode-btn" data-mode="numbered">🔢<br>Numéroté</div>
    <div class="mode-btn" data-mode="custom">✏️<br>Liste</div>
  </div>
  <div id="extra-opts"></div>
</div>

<!-- Stats -->
<div class="stats-grid">
  <div class="stat-box"><div class="stat-num ok" id="sOk">0</div><div class="stat-lbl">Connectés</div></div>
  <div class="stat-box"><div class="stat-num err" id="sErr">0</div><div class="stat-lbl">Erreurs</div></div>
  <div class="stat-box"><div class="stat-num warn" id="sPend">0</div><div class="stat-lbl">En attente</div></div>
</div>

<button id="startBtn">⚡ Lancer le flood</button>

<!-- Log -->
<div class="card">
  <div class="card-label">Journal</div>
  <div id="log"><span class="info">// prêt — entre le PIN et lance.</span></div>
</div>

<!-- Lodash required for Kahoot challenge eval -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script>
'use strict';

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
let bots    = [];
let running = false;
let stats   = { ok: 0, err: 0, pend: 0 };
let mode    = 'random';

// ════════════════════════════════════════════════════
//  LOG
// ════════════════════════════════════════════════════
const $log = document.getElementById('log');
function log(msg, cls = '') {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  el.textContent = `${ts()} ${msg}`;
  $log.appendChild(el);
  while ($log.children.length > 300) $log.removeChild($log.firstChild);
  $log.scrollTop = $log.scrollHeight;
}
function ts() {
  const d = new Date();
  return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}]`;
}
function pad(n) { return String(n).padStart(2,'0'); }

// ════════════════════════════════════════════════════
//  STATS
// ════════════════════════════════════════════════════
function refreshStats() {
  document.getElementById('sOk').textContent   = stats.ok;
  document.getElementById('sErr').textContent  = stats.err;
  document.getElementById('sPend').textContent = stats.pend;
  const total = parseInt(document.getElementById('botCount').value, 10);
  const pct = total > 0 ? Math.round((stats.ok + stats.err) / total * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
}

// ════════════════════════════════════════════════════
//  RANGE
// ════════════════════════════════════════════════════
const $range = document.getElementById('botCount');
$range.addEventListener('input', () => {
  document.getElementById('rdisp').textContent    = $range.value;
  document.getElementById('cntLabel').textContent = $range.value;
});

// ════════════════════════════════════════════════════
//  NAME MODES
// ════════════════════════════════════════════════════
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    renderOpts();
  });
});

const $extra = document.getElementById('extra-opts');
function renderOpts() {
  $extra.innerHTML = '';
  if (mode === 'numbered') {
    $extra.innerHTML = `<div class="card-label">Préfixe</div>
      <input type="text" id="prefix" placeholder="Bot" maxlength="20" value="Bot">`;
  } else if (mode === 'custom') {
    $extra.innerHTML = `<div class="card-label">Pseudos — un par ligne (cyclés si besoin)</div>
      <textarea id="customNames" placeholder="Alice&#10;Bob&#10;DarkHawk&#10;..."></textarea>`;
  }
}
renderOpts();

// ════════════════════════════════════════════════════
//  NAME GENERATOR
// ════════════════════════════════════════════════════
const ADJ  = ['Dark','Void','Ghost','Neon','Iron','Rogue','Glitch','Flux','Blaze','Storm',
               'Hex','Null','Rift','Byte','Drift','Nova','Shade','Blunt','Feral','Crypto'];
const NOUN = ['Wolf','Hawk','Blade','Cipher','Proxy','Specter','Vector','Viper','Wraith',
               'Comet','Pulse','Shard','Echo','Nexus','Forge','Claw','Fang','Edge','Core','Warden'];

function randName() {
  const a = ADJ [Math.floor(Math.random() * ADJ.length)];
  const n = NOUN[Math.floor(Math.random() * NOUN.length)];
  const x = Math.floor(Math.random() * 999);
  return `${a}${n}${x}`;
}

function buildNames(count) {
  if (mode === 'numbered') {
    const pfx = (document.getElementById('prefix')?.value || 'Bot').trim() || 'Bot';
    return Array.from({ length: count }, (_, i) => `${pfx}${i + 1}`);
  }
  if (mode === 'custom') {
    const raw  = document.getElementById('customNames')?.value || '';
    const list = raw.split('\n').map(s => s.trim()).filter(Boolean);
    if (!list.length) return Array.from({ length: count }, (_, i) => randName());
    return Array.from({ length: count }, (_, i) => list[i % list.length]);
  }
  return Array.from({ length: count }, () => randName());
}

// ════════════════════════════════════════════════════
//  KAHOOT SESSION TOKEN
// ════════════════════════════════════════════════════
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];

async function fetchSession(pin) {
  const target = `https://kahoot.it/reserve/session/${pin}/?${Date.now()}`;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(target), { signal: AbortSignal.timeout(9000) });
      if (!res.ok) continue;
      const text = await res.text();
      const data = JSON.parse(text);
      if (data.token && data.challenge !== undefined) return data;
    } catch (_) { /* try next */ }
  }
  throw new Error('session introuvable — PIN valide ? Partie démarrée ?');
}

// Solve Kahoot's CometD session challenge (uses lodash _)
function solveChallenge(encodedToken, challenge) {
  let offset;
  try {
    // Kahoot challenge is JS that references _ (lodash)
    // eslint-disable-next-line no-new-func
    offset = (new Function('_', `return ${challenge}`))(_);
  } catch (e1) {
    try {
      offset = (function (_) { return eval(challenge); })(_); // eslint-disable-line no-eval
    } catch (e2) {
      // last resort: extract first integer product
      const m = challenge.match(/(\d+)/g);
      offset = m ? m.reduce((a, b) => a * parseInt(b, 10), 1) : 1337;
    }
  }
  const key = String(offset);
  const raw = atob(encodedToken);
  let out = '';
  for (let i = 0; i < raw.length; i++) {
    out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}

// ════════════════════════════════════════════════════
//  BOT CLASS
// ════════════════════════════════════════════════════
class KahootBot {
  constructor(pin, wsToken, name) {
    this.pin      = pin;
    this.wsToken  = wsToken;
    this.name     = name;
    this.ws       = null;
    this.clientId = null;
    this._id      = 1;
    this._joined  = false;
    this._ka      = null; // keep-alive interval
  }

  _nextId() { return String(this._id++); }

  _send(obj) {
    if (this.ws?.readyState === WebSocket.OPEN)
      this.ws.send(JSON.stringify([obj]));
  }

  connect() {
    return new Promise((resolve, reject) => {
      const url = `wss://kahoot.it/cometd/${this.pin}/${this.wsToken}`;
      try { this.ws = new WebSocket(url); }
      catch (e) { reject(e); return; }

      const timer = setTimeout(() => {
        this.ws.close();
        reject(new Error('timeout connexion'));
      }, 14000);

      this.ws.onopen = () => {
        // Step 1 — CometD handshake
        this._send({
          channel: '/meta/handshake',
          version: '1.0',
          minimumVersion: '1.0',
          supportedConnectionTypes: ['websocket', 'long-polling', 'callback-polling'],
          id: this._nextId(),
          ext: { ack: false, timesync: { tc: Date.now(), l: 0, o: 0 } },
          advice: { timeout: 60000, interval: 0 }
        });
      };

      this.ws.onmessage = (ev) => {
        let msgs;
        try { msgs = JSON.parse(ev.data); } catch { return; }

        for (const m of msgs) {
          // Step 2 — handshake response → connect + subscribe
          if (m.channel === '/meta/handshake' && m.successful) {
            this.clientId = m.clientId;
            this._send({
              channel: '/meta/connect',
              connectionType: 'websocket',
              clientId: this.clientId,
              id: this._nextId(),
              advice: { timeout: 0 }
            });
            this._send({
              channel: '/meta/subscribe',
              subscription: '/service/player',
              clientId: this.clientId,
              id: this._nextId()
            });
            this._send({
              channel: '/meta/subscribe',
              subscription: '/service/status',
              clientId: this.clientId,
              id: this._nextId()
            });
          }

          // Step 3 — connect OK → send login
          if (m.channel === '/meta/connect' && m.successful && !this._joined) {
            this._joined = true;
            this._send({
              channel: '/service/controller',
              clientId: this.clientId,
              id: this._nextId(),
              data: {
                type: 'login',
                gameid: String(this.pin),
                host: 'kahoot.it',
                name: this.name,
                content: JSON.stringify({
                  device: {
                    userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    screen: { width: 1920, height: 1080 }
                  }
                })
              }
            });
            clearTimeout(timer);

            // keep-alive every 25 s
            this._ka = setInterval(() => {
              this._send({
                channel: '/meta/connect',
                connectionType: 'websocket',
                clientId: this.clientId,
                id: this._nextId()
              });
            }, 25000);

            resolve(this);
          }

          // Handle reconnect advice
          if (m.channel === '/meta/connect' && !m.successful) {
            // server ended the round — just close gracefully
            this.ws.close();
          }
        }
      };

      this.ws.onerror = () => { clearTimeout(timer); reject(new Error('ws erreur')); };
      this.ws.onclose = () => {
        clearInterval(this._ka);
        clearTimeout(timer);
        if (!this._joined) reject(new Error('connexion fermée'));
      };
    });
  }

  disconnect() {
    clearInterval(this._ka);
    this.ws?.close();
  }
}

// ════════════════════════════════════════════════════
//  FLOOD
// ════════════════════════════════════════════════════
async function flood() {
  const pin   = document.getElementById('pin').value.trim().replace(/\D/g, '');
  const count = parseInt($range.value, 10);
  if (!pin) { log('✖ PIN manquant', 'err'); return; }

  // reset
  bots.forEach(b => b.disconnect());
  bots   = [];
  stats  = { ok: 0, err: 0, pend: 0 };
  $log.innerHTML = '';
  running = true;
  refreshStats();
  setBtn('stop');

  log(`→ pin ${pin} — ${count} bots`, 'info');
  log(`→ récupération session…`, 'info');

  let wsToken;
  try {
    const sess = await fetchSession(pin);
    wsToken = solveChallenge(sess.token, sess.challenge);
    log(`✓ token décodé`, 'ok');
  } catch (e) {
    log(`✖ ${e.message}`, 'err');
    setBtn('start');
    running = false;
    return;
  }

  const names = buildNames(count);
  // adaptive delay: slower for large floods to avoid rate-limit
  const delay = count > 100 ? 120 : count > 50 ? 80 : count > 20 ? 50 : 30;
  log(`→ spawn ${count} bots — intervalle ${delay} ms`, 'info');

  for (let i = 0; i < count; i++) {
    if (!running) break;
    stats.pend++;
    refreshStats();

    const bot = new KahootBot(pin, wsToken, names[i]);
    bots.push(bot);

    bot.connect().then(() => {
      stats.ok++;
      stats.pend = Math.max(0, stats.pend - 1);
      log(`✓ ${bot.name}`, 'ok');
      refreshStats();
    }).catch(e => {
      stats.err++;
      stats.pend = Math.max(0, stats.pend - 1);
      log(`✖ ${bot.name} — ${e.message}`, 'err');
      refreshStats();
    });

    await sleep(delay);
  }

  // wait for stragglers
  await sleep(4000);
  log(`─ flood terminé — ${stats.ok} connectés · ${stats.err} erreurs`, stats.ok > 0 ? 'ok' : 'warn');
  refreshStats();
  if (running) { setBtn('start'); running = false; }
}

function stopFlood() {
  running = false;
  bots.forEach(b => b.disconnect());
  bots = [];
  log('⏹ flood stoppé', 'warn');
  setBtn('start');
  refreshStats();
}

function setBtn(state) {
  const btn = document.getElementById('startBtn');
  if (state === 'stop') {
    btn.textContent = '⏹ Stopper le flood';
    btn.classList.add('stop');
  } else {
    btn.textContent = '⚡ Lancer le flood';
    btn.classList.remove('stop');
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (running) stopFlood(); else flood();
});

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// PIN — numeric only
document.getElementById('pin').addEventListener('input', function () {
  this.value = this.value.replace(/\D/g, '');
});
</script>
</body>
</html>
